apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config
data:
  RAG_SERVICE_URL: "http://rag-service:8100"
  REDIS_URL: "redis://redis-service:6379"
  CLIENT_URL: "http://localhost:5173"
  SERVER_URL: "http://localhost:3000"
  MONGO_USE_TRANSACTIONS: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: server-secrets
type: Opaque
stringData:
  MONGO_URI: "${{ secrets.MONGO_URI }}"
  JWT_SECRET: "${{ secrets.JWT_SECRET }}"
  MISTRAL_API_KEY: "${{ secrets.MISTRAL_API_KEY }}"
  MISTRAL_API_KEY1: "${{ secrets.MISTRAL_API_KEY }}"
  GOOGLE_CLIENT_ID: "${{ secrets.GOOGLE_CLIENT_ID }}"
  GOOGLE_CLIENT_SECRET: "${{ secrets.GOOGLE_CLIENT_SECRET }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: system2-server
  labels:
    app: system2-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: system2-server
  template:
    metadata:
      labels:
        app: system2-server
    spec:
      containers:
      - name: system2-server
        image: ${{ secrets.DOCKER_USERNAME }}/system2-server:latest # Pulled from your Docker Hub registry
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: server-config
        - secretRef:
            name: server-secrets
